services:
  ubuntu-vps:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: ubuntu-vps
    hostname: vps-ubuntu
    tty: true
    stdin_open: true
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    systemd: true
    privileged: true
    security_opt:
      - seccomp:unconfined
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    dns:
      - 1.1.1.1
      - 8.8.8.8
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv4.ip_forward=1
    storage_opt:
      size: "65G"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/lxcfs/proc/cpuinfo:/proc/cpuinfo:ro,z
      - /var/lib/lxcfs/proc/meminfo:/proc/meminfo:ro,z
      - /var/lib/lxcfs/proc/stat:/proc/stat:ro,z
      - /var/lib/lxcfs/proc/uptime:/proc/uptime:ro,z
      - /var/lib/lxcfs/proc/diskstats:/proc/diskstats:ro,z
      - vps-system-root:/
    cpus: 4.0
    mem_limit: 4g
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      vps-lan:
        ipv4_address: ${VPS_IP}
      vps-bridge:

networks:
  vps-lan:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_IFACE}
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
  vps-bridge:
    driver: bridge

volumes:
  vps-system-root:
