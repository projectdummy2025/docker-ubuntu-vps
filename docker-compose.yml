services:
  ubuntu-vps:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: ubuntu-vps
    tty: true
    stdin_open: true
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    systemd: true
    privileged: true
    security_opt:
      - seccomp:unconfined
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/lxcfs/proc/cpuinfo:/proc/cpuinfo:ro,z
      - /var/lib/lxcfs/proc/meminfo:/proc/meminfo:ro,z
      - /var/lib/lxcfs/proc/stat:/proc/stat:ro,z
      - /var/lib/lxcfs/proc/uptime:/proc/uptime:ro,z
      - /var/lib/lxcfs/proc/diskstats:/proc/diskstats:ro,z
    cpus: 4.0
    mem_limit: 8g
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      vps-lan:
        ipv4_address: ${VPS_IP}
      vps-bridge:

networks:
  vps-lan:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_IFACE}
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
  vps-bridge:
    driver: bridge
